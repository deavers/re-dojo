  <style>:root {
  --bg: #0b0f17; --panel: #111827; --tile: #162033; --tile-hover: #1c2a43; --text: #e6edf7;
  --muted: #93a1b8; --border: #26324a; --accent: #8b6cff; --accent-2: #22d3ee; --ok: #22c55e;
  --warn: #f59e0b; --danger: #ef4444; --lab: #22d3ee; --quest: #f472b6; --edge: #8b6cff;
  --shadow: 0 6px 24px rgba(0, 0, 0, .35); color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f6fb; --panel: #ffffff; --tile: #ffffff; --tile-hover: #eef1fb; --text: #141a2a;
    --muted: #5b6478; --border: #d7dcea; --accent: #5b3fe0; --accent-2: #0e7490; --ok: #15803d;
    --warn: #b45309; --danger: #b91c1c; --lab: #0e7490; --quest: #be185d; --edge: #5b3fe0;
    --shadow: 0 6px 24px rgba(20, 26, 42, .12); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f5f6fb; --panel: #ffffff; --tile: #ffffff; --tile-hover: #eef1fb; --text: #141a2a;
  --muted: #5b6478; --border: #d7dcea; --accent: #5b3fe0; --accent-2: #0e7490; --ok: #15803d;
  --warn: #b45309; --danger: #b91c1c; --lab: #0e7490; --quest: #be185d; --edge: #5b3fe0;
  --shadow: 0 6px 24px rgba(20, 26, 42, .12); color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
}
a { color: var(--accent-2); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--panel); padding: 8px 12px; z-index: 50; }
.skip:focus { left: 8px; }

.top { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); }
.brand { display: flex; gap: 12px; align-items: center; }
.logo { font-size: 32px; }
h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.card { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; }
.rank { display: flex; gap: 10px; align-items: center; }
.rank-code { font-weight: 800; font-size: 22px; min-width: 56px; text-align: center; padding: 4px 8px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.rank-title { font-weight: 600; }
.tp { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
.tp-bar { width: 90px; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
.tp-fill { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.stats { display: flex; gap: 16px; margin: 0; }
.stats div { text-align: center; }
.stats dt { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
.stats dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); background: var(--tile); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
.btn:hover { background: var(--tile-hover); }
.btn[aria-pressed="true"] { border-color: var(--warn); color: var(--warn); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.filters { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
.filters input[type="search"] { flex: 1 1 220px; min-width: 0; }
.filters input[type="search"], .filters select { background: var(--tile); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; max-width: 100%; }
.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.count { color: var(--muted); font-size: 12px; margin-left: auto; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) {
  .layout.has-panel { grid-template-columns: minmax(0, 1fr) 400px; }
}
.map-wrap { position: relative; padding: 12px 16px 64px; min-width: 0; overflow-x: clip; }
.map-wrap:focus { outline: none; }
.edges { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 2; }
.edges path.edge { fill: none; stroke: var(--edge); stroke-width: 2; stroke-dasharray: 6 4; opacity: .85; }
.edges .arrow-head { fill: var(--edge); }

.band { margin: 14px 0 6px; }
.band-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin-bottom: 8px; padding: 4px 0;
  /* Opaque layer above the edge SVG (z 2): dependency arrows run UNDER tier titles and the open/closed badges. */
  position: relative; z-index: 3; background: var(--bg); }
.band-head h2 { margin: 0; font-size: 15px; }
.band-head .meta { color: var(--muted); font-size: 12px; }
.band-state { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
.band-state.open { color: var(--ok); border-color: var(--ok); }
.band-state.next { color: var(--warn); border-color: var(--warn); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }

.tile { position: relative; z-index: 3; text-align: left; display: flex; flex-direction: column; gap: 4px; min-height: 92px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--tile); cursor: pointer; transition: transform .12s, background .12s, border-color .12s; }
.tile:hover { background: var(--tile-hover); transform: translateY(-1px); }
.tile .kind { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile .name { font-weight: 600; font-size: 13px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile .ptags { display: flex; flex-wrap: wrap; gap: 4px; }
.tile .ptag { font-size: 10px; line-height: 1.4; padding: 0 6px; border-radius: 999px; border: 1px solid var(--warn); color: var(--warn); }
.tile .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
.pips { letter-spacing: 1px; color: var(--accent); }
.pips .off { color: var(--border); }
.icons { display: inline-flex; gap: 3px; }
.tile.kind-lab { border-left: 3px solid var(--lab); }
.tile.kind-crackme { border-left: 3px solid var(--lab); border-left-style: double; }
.tile.kind-quest { border-left: 3px solid var(--quest); }
.tile.done { border-color: var(--ok); }
.tile.done .name::before { content: "✓ "; color: var(--ok); }
.tile.locked { opacity: .55; }
.tile.selected { outline: 2px solid var(--accent); outline-offset: 1px; }
.tile.prereq { box-shadow: 0 0 0 2px var(--accent-2); }
.tile.dependent { box-shadow: 0 0 0 1px var(--accent); }

.panel { background: var(--panel); border-left: 1px solid var(--border); padding: 18px 18px 40px; position: relative; }
@media (min-width: 1000px) {
  .panel { position: sticky; top: var(--filters-h, 52px); align-self: start; max-height: calc(100vh - var(--filters-h, 52px)); overflow: auto; }
}
@media (max-width: 999.98px) {
  .panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; max-height: 82vh; overflow: auto; border-left: 0; border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; box-shadow: var(--shadow); }
}
.close { position: absolute; right: 10px; top: 10px; border: 0; background: transparent; font-size: 18px; cursor: pointer; color: var(--muted); }
.panel h2 { margin: 0 28px 4px 0; font-size: 18px; }
.panel h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 18px 0 6px; }
.panel .meta { color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; gap: 4px; align-items: center; border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; font-size: 12px; background: var(--tile); }
button.chip { cursor: pointer; }
.src { font-size: 11px; font-weight: 600; white-space: nowrap; }
.src.mine { color: var(--ok); }
.src.verify { color: var(--warn); }
.banner { border: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); border-radius: 10px; padding: 10px 12px; margin: 12px 0; }
.banner strong { color: var(--warn); }
.hint { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin: 8px 0; background: var(--tile); }
.hint-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.hint p { margin: 0; white-space: pre-wrap; }
.hint .refs { margin: 6px 0 0; padding-left: 18px; font-size: 12px; }
.empty { color: var(--muted); font-style: italic; }
details { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; background: var(--tile); }
summary { cursor: pointer; }
details p { margin: 8px 0 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
.small { font-size: 12px; color: var(--muted); }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 16px; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; }

@media (max-width: 600px) {
  .top, .filters, .map-wrap { padding-left: 16px; padding-right: 16px; }
  .tiles { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .stats { gap: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>

t","prerequisites":{"labs":["lab02"],"games":[],"source":"derived"},"notes":[{"path":"Course_Solutions/Lab12_Double_and_Fuzzy_Scan/lab12_double_fuzzy.cpp","kind":"lab_source"},{"path":"Course_Solutions/Lab12_Double_and_Fuzzy_Scan/lab12_core.hpp","kind":"lab_source"}],"hints":[{"level":1,"kind":"nudge","text":"Число на экране округлено, поэтому точный скан по нему ничего не найдёт. Начни с «Unknown initial value», а дальше отсеивай по тому, как значение меняется после твоих действий.","source":"my_notes","refs":["Course_Solutions/Lab12_Double_and_Fuzzy_Scan/lab12_double_fuzzy.cpp"]},{"level":2,"kind":"concept","text":"Эссенция и чистота — разные типы с плавающей точкой: одна занимает 8 байт, другая 4. Сканируй и пиши каждую своим типом. Значение, записанное не тем типом, испортит соседние байты или окажется крошечным числом.","source":"my_notes","refs":["Course_Solutions/Lab12_Double_and_Fuzzy_Scan/lab12_core.hpp"]},{"level":3,"kind":"near_spoiler","text":"В lab12_core.hpp: essence — double на +0x00, catalystPurity — float на +0x08. Фильтр в игре упирается в kPurityCap, а камню нужны ровно 1000000 эссенции и чистота ровно 1.0 (100 %), так что обе величины ставь правкой памяти.","source":"my_notes","refs":["Course_Solutions/Lab12_Double_and_Fuzzy_Scan/lab12_core.hpp"]}],"hints_status":"draft","safety":{"restricted":false},"check":"selftest","platform":{"windows_only":false,"msvc_only":false,"needs_unity":false,"needs_dotnet":false},"hints_batch":"labs_01.json"},{"id":"cm01","kind":"crackme","label":"CM 01","title":"Apprentice Gate","tier":"F+","difficulty_raw":0.7,"difficulty":1,"exp":150,"path":"Crackmes_and_CTF/01_Apprentice_Gate/crackme01_strings.cpp","prerequisite_text":"Basic terminal I/O","concept":"`.rdata` plaintext strings vs runtime Stack Strings in Ghidra/x64dbg","prerequisites":{"labs":[],"games":[],"source":"derived"},"notes":[{"path":"Crackmes_and_CTF/01_Apprentice_Gate/crackme01_strings.cpp","kind":"lab_source"}],"hints":[],"hints_status":"pending","saf "}],"hints":[{"level":1,"kind":"nudge","text":"Открой объект героя в Structure Dissect (или ReClass.NET) и не считай смещения в уме: компилятор вставляет пустые байты между полями разного размера.","source":"my_notes","refs":["Course_Solutions/Lab17_Nested_Structs_and_Padding/lab17_nested_padding.cpp"]},{"level":2,"kind":"concept","text":"Поле выравнивается по своему размеру: double — по 8, uint16 — по 2. Поэтому вложенная структура с double сама начинается с границы 8. Только у упакованной структуры пустых байтов нет, и её поле может стоять на нечётном адресе.","source":"my_notes","refs":["Course_Solutions/Lab17_Nested_Structs_and_Padding/lab17_core.hpp"]},{"level":3,"kind":"near_spoiler","text":"В lab17_core.hpp смещения внутри g_Hero: crit (double) — +0x18, durability (uint16) — +0x22, goldValue упакованной добычи (uint32) — +0x29. Их закрепляют static_assert.","source":"my_notes","refs":["Course_Solutions/Lab17_Nested_Structs_and_Padding/lab17_core.hpp"]}],"hints_status":"draft","safety":{"restricted":false},"check":"selftest","platform":{"windows_only":false,"msvc_only":false,"needs_unity":false,"needs_dotnet":false},"hints_batch":"labs_01.json"},{"id":"lab04","kind":"lab","label":"Lab 04","title":"MultiLevel Pointers","tier":"E","difficulty_raw":1.8,"difficulty":1,"exp":260,"path":"Course_Solutions/Lab04_MultiLevel_Pointers/lab04_pointer_chains.cpp","prerequisite_text":"Struct offsets","concept":"Dynamic Heap reallocation (`new`/`delete`) & 3-level Pointer Chains","prerequisites":{"labs":["lab03"],"games":[],"source":"derived"},"notes":[{"path":"Course_Solutions/Lab04_MultiLevel_Pointers/lab04_pointer_chains.cpp","kind":"lab_source"},{"path":"Game_Hacking/Dojo_Labs_Reference.CT","kind":"cheat_table"}],"hints":[],"hints_status":"pending","safety":{"restricted":false},"check":"quest","platform":{"windows_only":false,"msvc_only":false,"needs_unity":false,"needs_dotnet":false}},{"id":"cm02","kind":"crackme","label":"CM 02","title":"Mathematical Lock","tier":"E","difficulty_raw":1.9,"difficulty":1,"exp":260,"path":"Crackmes_and_CTF/02_Mathematical_Lock/crackme02_serial_math.cpp","prerequisite_text":"Assembly jumps","concept":"Reversing `AAAA-BBBB-CCCC` arithmetic & writing a Python Keygen","prerequisites":{"labs":["cm01"],"games":[],"source":"derived"},"notes":[{"path":"Crackmes_and_CTF/02_Mathematical_Lock/crackme02_serial_math.cpp","kind":"lab_source"}],"hints":[],"hints_status":"pending","safety":{"restricted":false},"check":"flag","platform":{"windows_only":false,"msvc_only":false,"needs_unity":false,"needs_dotnet":false}},{"id":"lab18","kind":"lab","label":"Lab 18","title":"Lazy Singleton","tier":"E+","difficulty_raw":2.0,"difficulty":1,"exp":300,"path":"Course_Solutions/Lab18_Lazy_Singleton/lab18_lazy_singleton.cpp","prerequisite_text":"Pointer chains","concept":"A manager pointer that stays empty until first use","prerequisites":{"labs":["lab04"],"games":[],"source":"derived"},"notes":[{"path":"Course_Solutions/Lab18_Lazy_Singleton/lab18_lazy_singleton.cpp","kind":"lab_source"},{"path":"Course_Solutions/Lab18_Lazy_Singleton/lab18_core.hpp","kind":"lab_source"}],"hints":[{"level":1,"kind":"nudge","text":"Статический указатель на менеджер существует с самого запуска, но пока ты ни разу не зашёл в подземелье, в нём ноль. Сначала дай игре создать объекты, потом ищи.","source":"my_notes","refs":["Course_Solutions/Lab18_Lazy_Singleton/lab18_lazy_singleton.cpp"]},{"level":2,"kind":"concept","text":"Найди самоцветы точным сканом, затем «что обращается к этому адресу»: получишь смещение внутри инвентаря и адрес самого инвентаря. Дальше ищи, кто хранит указатель на инвентарь, и так вверх до статического указателя.","source":"my_notes","refs":["Course_Solutions/Lab18_Lazy_Singleton/lab18_lazy_singleton.cpp"]},{"level":3,"kind":"near_spoiler","text":"В lab18_core.hpp цепочка такая: [g_pGameManager] +0x08 -> Player, Player +0x08 -> Inventory, Inventory +0x10 = gems (int32). Пиши 99999 только после первого входа в подземелье.","source":"my_notes","refs":["Course_Solutions/Lab18_Lazy_Singleton/lab18_core.hpp"]}],"hints_status":"draft","safety":{"restricted":false},"check":"selftest","platform":{"windows_only":false,"msvc_only":false,"needs_unity":false,"needs_dotnet":false},"hints_batch":"labs_01.json"},{"id":"lab19","kind":"lab","label":"Lab 19","title":"Pointer Scan Restarts","tier":"E+","difficulty_raw":2.1,"difficulty":2,"exp":300,"path":"Course_Solutions/Lab19_Pointer_Scan_Restarts/lab19_pointer_scan.cpp","prerequisite_text":"Lazy singleton","concept":"Pointer scan, restart and rescan until only a path that survives restarts is left","prerequisites":{"labs":["lab18"],"games":[],"source":"derived"},"notes":[{"path":"Course_Solutions/Lab19_Pointer_Scan_Restarts/lab19_pointer_scan.cpp","kind":"lab_source"},{"path":"Course_Solutions/Lab19_Pointer_Scan_Restarts/lab19_core.hpp","kind":"lab_source"}],"hints":[{"level":1,"kind":"nudge","text":"Адрес золота меняется при каждом запуске, так что сохранённый адрес бесполезен. Сделай сканирование указателей на золото, перезапусти программу, найди золото заново и отсей список указателей по новому адресу.","source":"my_notes","refs":["Course_Solutions/Lab19_Pointer_Scan_Restarts/lab19_pointer_scan.cpp"]},{"level":2,"kind":"concept","text":"Два пути выглядят правильными: у одного существа золото каждый ход копирует золото героя, а ещё есть свежая копия самого героя. Число на экране совпадёт, но это другие адреса — после перезапуска такие пути проверку не пройдут. Оставляй только пути, пережившие несколько перезапусков.","source":"my_notes","refs":["Course_Solutions/Lab19_Pointer_Scan_Restarts/lab19_core.hpp"]},{"level":3,"kind":"near_spoiler","text":"В lab19_core.hpp стабильный путь такой: g_World +0x18 -> Registry, +0x08 -> list, +0x18 (элемент 3) -> герой, +0x2C = gold. Ловушки: lastSpawned на +0x10 и heroSnapshot на +0x20.","source":"my_notes","refs":["Course_Solutions/Lab19_Pointer_Scan_Restarts/lab19_core.hpp"]}],"hints_status":"draft","safety":{"restricted":false},"check":"checker","platform":{"windows_only":false,"msvc_only":false,"needs_unity":false,"needs_dotnet":false},"hints_batch":"labs_01.json"},{"id":"lab05","kind":"lab","label":"Lab 05","title":"Code Injection and NOP","tier":"E+","difficulty_raw":2.3,"difficulty":2,"exp":300,"path":"Course_Solutions/Lab05_Code_Injection_and_NOP/lab05_code_injection.cpp","prerequisite_text":"Heap pointers","concept":"Hardware Breakpoints (\"What writes\"), `NOP` (`0x90`), & Auto Assembler `alloc`","prerequisites":{"labs":["lab04"],"games":[],"source":"derived"},"notes":[{"path":"Course_Solutions/Lab05_Code_Injection_and_NOP/lab05_code_injection.cpp","kind":"lab_source"},{"path":"Game_Hacking/Dojo_Labs_Reference.CT","kind":"cheat_table"}],"hints":[],"hints_status":"pending","safety":{"restricted":false},"check":"quest","platform":{"windows_only":false,"msvc_only":false,"needs_unity":false,"needs_dotnet":false}},{"id":"cm10","kind":"crackme","label":"CM 10","title":"Checksum Serial","tier":"D-","difficulty_raw":2.6,"difficulty":2,"exp":350,"path":"Crackmes_and_CTF/10_Checksum_Serial/crackme10_checksum_serial.cpp","prerequisite_text":"Python keygen","concept":"Rule-based serial with a per-run challenge block: reverse the rules, write a key generator","prerequisites":{"labs":["cm02"],"games":[],"source":"derived"},"notes":[{"path":"Crackmes_and_CTF/10_Checksum_Serial/crackme10_checksum_serial.cpp","kind":"lab_source"}],"hints":[{"level":1,"kind":"nudge","text":"Здесь нет одного правильного серийника, с которым сравнивают ввод, а второй блок каждый раз новый. Найди все проверки, которые получают разобранные цифры и возвращают да/нет, — каждая из них отдельное правило.","source":"my_notes","refs":["Crackmes_and_CTF/10_Checksum_Serial/crackme10_checksum_serial.cpp"]},{"level":2,"kind":"concept","text":"Одно правило проходит по цифрам справа налево и удваивает каждую вторую — это алгоритм Луна, контрольная цифра. Остальные связывают блоки: второй блок должен совпасть с вызовом, у первого задана сумма цифр, третий вычисляется из первых двух.","source":"my_notes","refs":["Crackmes_and_CTF/10_Checksum_Serial/crackme10_checksum_serial.cpp"]},{"level":3,"kind":"near_spoiler","text":"В crackme10_checksum_serial.cpp: блок B = вызов, сумма цифр блока A = 20, блок C = (A * 7 + B * 3 + 1234) % 10000, последняя цифра — контрольная по Луну над 13 цифрами. Кейген: выбери A, возьми B из вызова, вычисли C и контрольную цифру.","source":"my_notes","refs":["Crackmes_and_CTF/10_Checksum_Serial/crackme10_checksum_serial.cpp"]}],"hints_status":"draft","safety":{"restricted":false},"check":"flag","platform":{"windows_only":false,"msvc_only":false,"needs_unity":false,"needs_dotnet":false},"hints_batch":"labs_01.json"},{"id":"lab06","kind":"lab","label":"Lab 06","title":"Shared Code Disambiguation","tier":"D","difficulty_raw":3.0,"difficulty":2,"exp":400,"path":"Course_Solutions/Lab06_Shared_Code_Disambiguation/lab06_shared_code.cpp","prerequisite_text":"Auto Assembler","concept":"Shared Engine Code: Filtering `victim->factionId` (`[rcx+08]`) for 1-Hit Kill","prerequisites":{"labs":["lab05"],"games":[],"source":"derived"},"notes":[{"path":"Course_Solutions/Lab06_Shared_Code_Disambiguation/lab06_shared_code.cpp","kind":"lab_source"},{"path":"Game_Hacking/Dojo_Labs_Reference.CT","kind":"cheat_table"}],"hints":[],"hints_status":"pending","safety":{"restricted":false},"check":"quest","platform":{"windows_only":false,"msvc_only":false,"needs_unity":false,"needs_dotnet":false}},{"id":"cm03","kind":"crackme","label":"CM 03","title":"XOR and Rol Cipher","tier":"D","difficulty_raw":3.1,"difficulty":2,"exp":400,"path":"Crackmes_and_CTF/03_XOR_and_Rol_Cipher/crackme03_xor_rol.cpp","prerequisite_text":"Decompiler math","concept":"Bitwise rotation (`ROL8`/`ROR8`) + index-dependent `XOR` cipher inversion","prerequisites":{"labs":["cm02"],"games":[],"source":"derived"},"notes":[{"path":"Crackmes_and_CTF/03_XOR_and_Rol_Cipher/crackme03_xor_rol.cpp","kind":"lab_source"}],"hin ицу Торговца нельзя — Капитан перестанет быть Капитаном.","source":"my_notes","refs":["Course_Solutions/Lab32_Shadow_VMT/lab32_core.hpp"]},{"level":3,"kind":"near_spoiler","text":"В lab32_core.hpp: IsBribable — slot 2 (table +0x10), в таблице 4 слота. Капитан — g_Guards[2], объект +0x20 от начала массива, его vptr на +0x00 объекта. В копии таблицы запиши в +0x10 значение из таблицы g_Merchant по +0x10.","source":"my_notes","refs":["Course_Solutions/Lab32_Shadow_VMT/lab32_core.hpp"]}],"hints_status":"draft","safety":{"restricted":false},"check":"selftest","platform":{"windows_only":false,"msvc_only":false,"needs_unity":false,"needs_dotnet":false},"hints_batch":"labs_01.json"},{"id":"cm04","kind":"crackme","label":"CM 04","title":"Struct License File","tier":"C","difficulty_raw":4.3,"difficulty":3,"exp":600,"path":"Crackmes_and_CTF/04_Struct_License_File/crackme04_binary_license.cpp","prerequisite_text":"Bitwise checksums","concept":"File Format RE: Reversing a packed 24-byte `license.dat` struct (`struct.pack`)","prerequisites":{"labs":["cm03"],"games":[],"source":"derived"},"notes":[{"path":"Crackmes_and_CTF/04_Struct_License_File/crackme04_binary_license.cpp","kind":"lab_source"}],"hints":[],"hints_status":"pending","safety":{"restricted":false},"check":"flag","platform":{"windows_only":false,"msvc_only":false,"needs_unity":false,"needs_dotnet":false}},{"id":"lab39","kind":"lab","label":"Lab 39","title":"DotNet Decompile","tier":"C+","difficulty_raw":4.7,"difficulty":3,"exp":680,"path":"Course_Solutions/Lab39_DotNet_Decompile/game/Program.cs","prerequisite_text":"Classes and method tables","concept":"Own .NET 8 game: decompile with dnSpyEx / ILSpy, read how the passphrase is forged, reproduce it","prerequisites":{"labs":["lab07"],"games":[],"source":"derived"},"notes":[{"path":"Course_Solutions/Lab39_DotNet_Decompile/game/Program.cs","kind":"lab_source"}],"hints":[{"level":1,"kind":"nudge","text":"Это управляемая сборка .NET: имена классов и методов сохранились. Открой Lab39.dll в dnSpyEx или ILSpy и найди метод, который сравнивает твой ввод с фразой.","source":"my_notes","refs":["Course_Solutions/Lab39_DotNet_Decompile/game/Program.cs"]},{"level":2,"kind":"concept","text":"Фраза не хранится строкой — её собирает отдельный метод из массива чисел. Перепиши этот цикл у себя (C# Interactive, Python) и посмотри, что получится.","source":"my_notes","refs":["Course_Solutions/Lab39_DotNet_Decompile/game/Program.cs"]},{"level":3,"kind":"near_spoiler","text":"В Program.cs ForgePassphrase делает chars[i] = (Gears[i] ^ (0x2A + i * 5)) - i для каждого элемента Gears. Сравнение точное (Ordinal), регистр важен.","source":"my_notes","refs":["Course_Solutions/Lab39_DotNet_Decompile/game/Program.cs"]}],"hints_status":"draft","safety":{"restricted":false},"check":"flag","platform":{"windows_only":false,"msvc_only":false,"needs_unity":false,"needs_dotnet":true},"hints_batch":"labs_01.json"},{"id":"lab08","kind":"lab","label":"Lab 08","title":"3D Math and WorldToScreen","tier":"B-","difficulty_raw":5.0,"difficulty":3,"exp":770,"path":"Course_Solutions/Lab08_3D_Math_and_WorldToScreen/lab08_3d_w2s_simulator.cpp","prerequisite_text":"Reconstructed classes","concept":"3D Vectors (`Vec3`), Camera Pitch/Yaw Euler angles (`atan2`), & 4x 4 `ViewMatrix`","prerequisites":{"labs":["lab07"],"games":[],"source":"derived"},"notes":[{"path":"Course_Solutions/Lab08_3D_Math_and_WorldToScreen/lab08_3d_w2s_simulator.cpp","kind":"lab_source"}],"hints":[],"hints_status":"pending","safety":{"restricted":false},"check":"quest","platform":{"windows_only":false,"msvc_only":false,"needs_unity":false,"needs_dotnet":false}},{"id":"cm05","kind":"crackme","label":"CM 05","title":"AntiDebug Sentinel","tier":"B","difficulty_raw":5.5,"difficulty":3,"exp":860,"path":"Crackmes_and_CTF/05_AntiDebug_Sentinel/crackme05_antidebug.cpp","prerequisite_text":"x64dbg breakpoints","concept":"Bypassing `IsDebuggerPresent`, `PEB`, & `0xCC` (`INT3`) scans + FNV-1a","prerequisites":{"labs":["c N», затем «индекс имя» для каждой записи.","source":"my_notes","refs":["Course_Solutions/Lab45_MiniUE_Name_Pool/lab45_core.hpp"]}],"hints_status":"draft","safety":{"restricted":false},"check":"checker","platform":{"windows_only":false,"msvc_only":false,"needs_unity":false,"needs_dotnet":false},"hints_batch":"labs_01.json"},{"id":"lab09","kind":"lab","label":"Lab 09","title":"Internal DLL and Hooks","tier":"B+","difficulty_raw":5.8,"difficulty":3,"exp":960,"path":"Course_Solutions/Lab09_Internal_DLL_and_Hooks/lab09_internal_hook_target.cpp","prerequisite_text":"Engine structs","concept":"Internal DLL Injection: Calling internal engine functions by RVA pointer","prerequisites":{"labs":["lab08"],"games":[],"source":"derived"},"notes":[{"path":"Course_Solutions/Lab09_Internal_DLL_and_Hooks/lab09_internal_hook_target.cpp","kind":"lab_source"}],"hints":[],"hints_status":"pending","safety":{"restricted":false},"check":"quest","platform":{"windows_only":true,"msvc_only":false,"needs_unity":false,"needs_dotnet":false}},{"id":"lab52","kind":"lab","label":"Lab 52","title":"Embedded Lua","tier":"A-","difficulty_raw":6.3,"difficulty":4,"exp":1100,"path":"Course_Solutions/Lab52_Embedded_Lua/lab52_embedded_lua.cpp","prerequisite_text":"Internal DLL","concept":"Embedded Lua 5.4: find the game's `lua_State`, run your own chunk through `lua54.dll` (`luaL_loadstring` + `lua_pcallk`)","prerequisites":{"labs":["lab09","lab17"],"games":[],"source":"derived"},"notes":[{"path":"Course_Solutions/Lab52_Embedded_Lua/lab52_embedded_lua.cpp","kind":"lab_source"},{"path":"Course_Solutions/Lab52_Embedded_Lua/lab52_core.hpp","kind":"lab_source"}],"hints":[{"level":1,"kind":"nudge","text":"Золото и титул хранятся не в C++-структурах, а в Lua-таблице hero. Вместо поиска чисел найди сам lua_State игры: указатель на него где-то хранит движок.","source":"my_notes","refs":["Course_Solutions/Lab52_Embedded_Lua/lab52_embedded_lua.cpp"]},{"level":2,"kind":"concept","text":"Функции Lua экспортирует lua54.dll, поэтому внедрённая DLL может взять luaL_loadstring и lua_pcallk через GetProcAddress. Загрузи кусок кода и вызови его в состоянии игры. Окружение урезано: os и io нет.","source":"my_notes","refs":["Course_Solutions/Lab52_Embedded_Lua/lab52_embedded_lua.cpp"]},{"level":3,"kind":"near_spoiler","text":"В lab52_core.hpp указатель lua_State* лежит в g_Engine на +0x10. Выполни в нём hero.gold = 1000000; hero.title = \"Archmage\" — именно поля таблицы hero, золото числом.","source":"my_notes","refs":["Course_Solutions/Lab52_Embedded_Lua/lab52_core.hpp"]}],"hints_status":"draft","safety":{"restricted":false},"check":"flag","platform":{"windows_only":true,"msvc_only":false,"needs_unity":false,"needs_dotnet":false},"hints_batch":"labs_01.json"},{"id":"lab54","kind":"lab","label":"Lab 54","title":"Emulator Guest RAM","tier":"A","difficulty_raw":6.5,"difficulty":4,"exp":1250,"path":"Course_Solutions/Lab54_Emulator_Guest_RAM/lab54_emulator.cpp","prerequisite_text":"Pointer chains","concept":"Own emulator: guest RAM in a host heap buffer, host address = RAM base + guest address","prerequisites":{"labs":["lab18"],"games":[],"source":"derived"},"notes":[{"path":"Course_Solutions/Lab54_Emulator_Guest_RAM/lab54_emulator.cpp","kind":"lab_source"},{"path":"Course_Solutions/Lab54_Emulator_Guest_RAM/lab54_core.hpp","kind":"lab_source"}],"hints":[{"level":1,"kind":"nudge","text":"Мануал консоли называет гостевые адреса, а Cheat Engine показывает адреса хоста. Найди счёт обычным сканом 2 Bytes, а потом подумай, как его адрес на хосте связан с гостевым адресом из мануала.","source":"my_notes","refs":["Course_Solutions/Lab54_Emulator_Guest_RAM/lab54_emulator.cpp"]},{"level":2,"kind":"concept","text":"Вычти гостевой адрес счёта из его адреса на хосте — получишь базу гостевой RAM. База меняется при каждом запуске, но эмулятор хранит указатель на неё в своём статическом объекте: найди, кто хранит это значение.","source":"my_notes","refs":["Course_Solutions/Lab54_Emulator_Guest_RAM/lab54_emulator.cpp"]},{"level":3,"kind":"near_spoiler","text":"В lab54_core.hpp указатель на гостевую RAM — Machine::ram на +0x08 объекта g_Machine. Адрес на хосте = значение этого указателя + гостевой адрес: жизни — гостевой 0x0300 (u8), счёт — гостевой 0x0302 (u16, little-endian).","source":"my_notes","refs":["Course_Solutions/Lab54_Emulator_Guest_RAM/lab54_core.hpp"]}],"hints_status":"draft","safety":{"restricted":false},"prerequisites_planned":["lab24"],"check":"selftest","platform":{"windows_only":false,"msvc_only":false,"needs_unity":false,"needs_dotnet":false},"hints_batch":"labs_01.json"},{"id":"cm16","kind":"crackme","label":"CM 16","title":"Z3 Constraint Lock","tier":"A","difficulty_raw":6.6,"difficulty":4,"exp":1250,"path":"Crackmes_and_CTF/16_Z3_Constraint_Lock/crackme16_z3_lock.cpp","prerequisite_text":"Rule-based serials, XOR","concept":"A system of coupled 64-bit constraints that only a solver handles in reasonable time","prerequisites":{"labs":["cm10","cm03"],"games":[],"source":"derived"},"notes":[{"path":"Crackmes_and_CTF/16_Z3_Constraint_Lock/crackme16_z3_lock.cpp","kind":"lab_source"}],"hints":[{"level":1,"kind":"nudge","text":"Все пять проверок — арифметика над 64-битными числами с переполнением. Выпиши их как уравнения: каждая связывает две-три части ключа.","source":"my_notes","refs":["Crackmes_and_CTF/16_Z3_Constraint_Lock/crackme16_z3_lock.cpp"]},{"level":2,"kind":"concept","text":"Одна часть ключа определяет остальные, но перебирать её — 2^64 вариантов, это нереально. Опиши систему решателю Z3: четыре BitVec ширины 64, сдвиг по кругу — RotateLeft, сдвиг вправо — LShR. Решение одно, Z3 находит его за доли секунды.","source":"my_notes","refs":["Crackmes_and_CTF/16_Z3_Constraint_Lock/crackme16_z3_lock.cpp"]},{"level":3,"kind":"near_spoiler","text":"В crackme16_z3_lock.cpp: a + b == kK1, (a ^ c) == kK2, Rotl(b, 23) + d == kK3, ((c * kGolden) ^ d) == kK4, (a & 0xFFFFFFFFULL) * 3ULL + (d >> 32) == kK5. Ответ — a-b-c-d в hex по 16 цифр.","source":"my_notes"   };
  const FAMILY_LABEL = {
    unity_mono: "Unity Mono", unity_il2cpp: "Unity IL2CPP", unreal_1: "Unreal 1", unreal_2: "Unreal 2", unreal_3: "Unreal 3",
    unreal_4: "Unreal 4", unreal_5: "Unreal 5", source: "Source", goldsrc: "GoldSrc", idtech: "id Tech", native_win32: "Native Win32",
    dotnet_xna: ".NET / XNA", gamemaker: "GameMaker", godot: "Godot", lua_hybrid: "C++ + Lua", popcap: "PopCap",
    renderware_gamebryo: "RenderWare/Gamebryo", js_web: "JS / Web", emulator: "Эмулятор", custom: "Свой движок",
    ambiguous: "Неоднозначный (unknown)",
  };
  const KIND_HINT = { nudge: "Намёк", concept: "Концепт", near_spoiler: "Почти спойлер" };
  const SRC_DETAIL = { my_notes: "из моих заметок", repo_catalog: "каталог репо", derived: "выведено правилом", needs_verification: "не подтверждено" };

  // ------------------------------------------------------------------ state (localStorage, defensive)
  const defaultState = () => ({ v: 1, done: {}, hints: {}, free: false, theme: null });
  function sanitizeState(raw) {
    const s = defaultState();
    if (!raw || typeof raw !== "object") return s;
    if (raw.done && typeof raw.done === "object") {
      for (const [id, rec] of Object.entries(raw.done)) {
        const n = BY_ID.get(id);
        const exp = rec && Number.isFinite(rec.exp) ? Math.round(rec.exp) : NaN;
        if (n && exp >= 0 && exp <= n.exp) s.done[id] = { exp };
      }
    }
    if (raw.hints && typeof raw.hints === "object") {
      for (const [id, k] of Object.entries(raw.hints)) {
        const n = BY_ID.get(id);
        if (n && Number.isInteger(k) && k > 0) s.hints[id] = Math.min(k, n.hints.length);
      }
    }
    s.free = raw.free === true;
    s.theme = raw.theme === "light" || raw.theme === "dark" ? raw.theme : null;
    return s;
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? sanitizeState(JSON.parse(raw)) : defaultState();
    } catch (e) {
      return defaultState();
    }
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* private mode / blocked storage */ }
  }
  let state = loadState();
  let selectedId = null;

  // ------------------------------------------------------------------ progression (port of rpg_manager.calculate_progression)
  function progression() {
    const counts = TIERS.map(() => 0);
    let exp = 0;
    for (const [id, rec] of Object.entries(state.done)) {
      counts[TIER_IDX[BY_ID.get(id).tier]] += 1;
      exp += rec.exp;
    }
    const total = counts.reduce((a, b) => a + b, 0);
    const tp = counts.map((c, i) => c + 3 * counts.slice(i + 1).reduce((a, b) => a + b, 0));
    const cleared = tp.map((v, i) => (v >= 3 ? i : -1)).filter((i) => i >= 0);
    const idx = cleared.length ? Math.min(TIERS.length - 1, Math.max(...cleared) + 1) : 0;
    return { idx, exp, total, curTp: Math.min(3, tp[idx]), counts };
  }
  const tierIndex = (n) => TIER_IDX[n.tier];
  const isLocked = (n, prog) => !state.free && tierIndex(n) > prog.idx + 1;
  const hintsOpened = (n) => state.hints[n.id] || 0;
  const awardFor = (n) => Math.round(n.exp * Math.max(MIN_FACTOR, 1 - HINT_PENALTY * hintsOpened(n)));

  // ------------------------------------------------------------------ tiny DOM helper (textContent only)
  function el(tag, opts = {}, children = []) {
    const e = document.createElement(tag);
    if (opts.cls) e.className = opts.cls;
    if (opts.text != null) e.textContent = String(opts.text);
    if (opts.attrs) for (const [k, v] of Object.entries(opts.attrs)) if (v != null && v !== false) e.setAttribute(k, v === true ? "" : String(v));
    if (opts.on) for (const [k, v] of Object.entries(opts.on)) e.addEventListener(k, v);
    for (const c of children) if (c) e.append(c);
    return e;
  }
  const $ = (id) => document.getElementById(id);
  function srcBadge(source) {
    const mine = source === "my_notes";
    return el("span", {
      cls: "src " + (mine ? "mine" : "verify"),
      text: mine ? "[из моих заметок]" : "[нужна проверка]",
      attrs: { title: SRC_DETAIL[source] || source },
    });
  }
  function repoHref(path, anchor) {
    // docs/dojo-map.html lives in docs/, repo files are one level up (works offline from a local clone).
    const safe = String(path).split("/").map(encodeURIComponent).join("/");
    return "../" + safe + (anchor ? "#" + encodeURIComponent(anchor) : "");
  }
  function nodeKindLabel(n) {
    if (n.kind === "game") return "#" + n.rank;
    if (n.kind === "campaign_quest") return "Квест кампании";
    return n.label;
  }
  function pips(d) {
    const s = el("span", { cls: "pips", attrs: { "aria-hidden": "true" } });
    s.append(document.createTextNode("●".repeat(d)), el("span", { cls: "off", text: "●".repeat(5 - d) }));
    return s;
  }
  let toastTimer = 0;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  // ------------------------------------------------------------------ filters
  function fillSelect(sel, label, options) {
    sel.replaceChildren(el("option", { text: label, attrs: { value: "" } }), ...options.map(([v, t]) => el("option", { text: t, attrs: { value: v } })));
  }
  function initFilters() {
    const games = DATA.games;
    const count = (fn) => { const m = new Map(); for (const g of games) for (const k of fn(g)) m.set(k, (m.get(k) || 0) + 1); return m; };
    const fam = count((g) => [g.engine_family]);
    fillSelect($("fEngine"), "Движок: все", [...fam.entries()].sort((a, b) => b[1] - a[1]).map(([k, c]) => [k, `${FAMILY_LABEL[k] || k} (${c})`]));
    const arch = count((g) => g.arch);
    fillSelect($("fArch"), "Архитектура: все", ["x86", "x64", "arm", "unknown"].filter((a) => arch.has(a)).map((a) => [a, `${a === "unknown" ? "не указана" : a} (${arch.get(a)})`]));
    fillSelect($("fDiff"), "Сложность: все", [1, 2, 3, 4, 5].map((d) => [String(d), `${"●".repeat(d)} ${d}/5`]));
    const tech = count((g) => g.techniques.map((t) => t.id));
    fillSelect($("fTech"), "Техника: все", [...tech.entries()].sort((a, b) => b[1] - a[1]).map(([k, c]) => [k, `${TECH_LABEL[k] || k} (${c})`]));
    fillSelect($("fStatus"), "Статус: все", [
      ["available", "Доступные"], ["done", "Пройденные"], ["todo", "Не пройденные"], ["locked", "Закрытые"],
      ["notes", "С моими заметками"], ["hints", "С подсказками"], ["restricted", "Ограниченные (safety)"],
    ]);
    $("filters").addEventListener("input", renderMap);
    $("filters").addEventListener("submit", (e) => e.preventDefault());
    $("filters").addEventListener("reset", () => setTimeout(renderMap, 0));
  }
  function readFilters() {
    return {
      q: $("fSearch").value.trim().toLowerCase(), engine: $("fEngine").value, arch: $("fArch").value,
      diff: $("fDiff").value, tech: $("fTech").value, status: $("fStatus").value, steam: $("fSteam").checked,
    };
  }
  function matches(n, f, prog) {
    const gameOnly = f.engine || f.arch || f.tech || f.steam;
    if (gameOnly && n.kind !== "game") return false;
    if (f.engine && n.engine_family !== f.engine) return false;
    if (f.arch && !n.arch.includes(f.arch)) return false;
    if (f.tech && !n.techniques.some((t) => t.id === f.tech)) return false;
    if (f.steam && !n.flags.steam_library) return false;
    if (f.diff && String(n.difficulty || "") !== f.diff) return false;
    const done = !!state.done[n.id];
    switch (f.status) {
      case "available": if (done || isLocked(n, prog)) return false; break;
      case "done": if (!done) return false; break;
      case "todo": if (done) return false; break;
      case "locked": if (!isLocked(n, prog)) return false; break;
      case "notes": if (!n.notes.length || n.kind === "lab" || n.kind === "crackme") return false; break;
      case "hints": if (!n.hints.length) return false; break;
      case "restricted": if (!n.safety.restricted) return false; break;
    }
    if (f.q) {
      const hay = [n.title, n.engine, n.what_to_find, n.concept, n.readme_text, n.label, n.rank, n.tier].filter(Boolean).join(" ").toLowerCase();
      if (!hay.includes(f.q)) return false;
    }
    return true;
  }

  // ------------------------------------------------------------------ map
  // Lab platform requirements from data/labs_index.json, shown on the tile itself.
  function platformTags(n) {
    const p = n.platform || {};
    const tags = [p.windows_only ? "только Windows" : null, p.needs_unity ? "нужен Unity" : null].filter(Boolean);
    return tags.length ? [el("span", { cls: "ptags" }, tags.map((t) => el("span", { cls: "ptag", text: t })))] : [];
  }
  function tile(n, prog) {
    const done = !!state.done[n.id];
    const locked = isLocked(n, prog);
    const cls = ["tile", "kind-" + (n.kind === "campaign_quest" ? "quest" : n.kind)];
    if (done) cls.push("done");
    if (locked) cls.push("locked");
    if (n.id === selectedId) cls.push("selected");
    const icons = el("span", { cls: "icons", attrs: { "aria-hidden": "true" } });
    if (locked) icons.append("🔒");
    if (n.safety.restricted) icons.append("⚠️");
    if (n.kind === "game" && n.notes.length) icons.append("📒");
    if (n.kind === "game" && n.flags.steam_library) icons.append("⭐");
    if (n.hints.length) icons.append("💡");
    const plat = n.platform || {};
    const status = [done ? "пройдено" : null, locked ? "закрыто" : null, n.safety.restricted ? "ограничено" : null,
      plat.windows_only ? "только Windows" : null, plat.needs_unity ? "нужен Unity" : null].filter(Boolean).join(", ");
    return el("button", {
      cls: cls.join(" "),
      attrs: { type: "button", "data-id": n.id, "aria-label": `${nodeKindLabel(n)} ${n.title}, тир ${n.tier}${status ? ", " + status : ""}` },
      on: { click: () => select(n.id) },
    }, [
      el("span", { cls: "kind", text: `${nodeKindLabel(n)} · ${n.exp} EXP` }),
      el("span", { cls: "name", text: n.title }),
      ...platformTags(n),
      el("span", { cls: "foot" }, [n.difficulty ? pips(n.difficulty) : el("span"), icons]),
    ]);
  }
  function renderMap() {
    const prog = progression();
    const f = readFilters();
    const bands = $("bands");
    bands.replaceChildren();
    let shown = 0;
    const shownBy = { game: 0, lab: 0, quest: 0 };
    TIERS.forEach((t, i) => {
      const nodes = BY_TIER[i].filter((n) => matches(n, f, prog));
      if (!nodes.length) return;
      shown += nodes.length;
      for (const n of nodes) shownBy[n.kind === "game" ? "game" : n.kind === "campaign_quest" ? "quest" : "lab"] += 1;
      const stateLabel = state.free ? ["open", "свободный режим"] : i <= prog.idx ? ["open", "открыт"] : i === prog.idx + 1 ? ["next", "прорыв: +3 TP"] : ["", "закрыт"];
      bands.append(el("section", { cls: "band", attrs: { "aria-labelledby": "band-" + i } }, [
        el("div", { cls: "band-head" }, [
          el("h2", { text: `Tier ${t.code} — ${t.title}`, attrs: { id: "band-" + i } }),
          el("span", { cls: "meta", text: `${t.exp} EXP за уровень · ${nodes.length}` }),
          el("span", { cls: "band-state " + stateLabel[0], text: stateLabel[1] }),
        ]),
        el("div", { cls: "tiles" }, nodes.map((n) => tile(n, prog))),
      ]));
    });
    // Separate counters per kind; totals come from the data (labs: data/labs_index.json status 'built').
    $("shownCount").textContent = `Игры: ${shownBy.game} из ${DATA.games.length} · Лабы и крякми: ${shownBy.lab} из ${DATA.labs.length}`
      + ` · Квесты: ${shownBy.quest} из ${DATA.quests.length}`;
    if (!shown) bands.append(el("p", { cls: "empty", text: "Ничего не найдено. Сбросьте фильтры." }));
    markRelations();
    scheduleEdges();
  }
  function markRelations() {
    const sel = selectedId && BY_ID.get(selectedId);
    const prereq = new Set(sel ? sel.prerequisites.labs : []);
    const deps = new Set(sel ? DEPENDENTS.get(sel.id) || [] : []);
    for (const t of document.querySelectorAll(".tile")) {
      const id = t.getAttribute("data-id");
      t.classList.toggle("selected", id === selectedId);
      t.classList.toggle("prereq", prereq.has(id));
      t.classList.toggle("dependent", deps.has(id));
    }
  }
  let edgeFrame = 0;
  function scheduleEdges() { cancelAnimationFrame(edgeFrame); edgeFrame = requestAnimationFrame(drawEdges); }
  function drawEdges() {
    const wrap = $("map"), svg = $("edges"), layer = $("edgeLayer");
    layer.replaceChildren();
    svg.setAttribute("width", 0);   // reset first: the SVG must not inflate the size it measures
    svg.setAttribute("height", 0);
    svg.setAttribute("width", wrap.scrollWidth);
    svg.setAttribute("height", wrap.scrollHeight);
    const sel = selectedId && BY_ID.get(selectedId);
    if (!sel) return;
    const w = wrap.getBoundingClientRect();
    const tileOf = (id) => wrap.querySelector(`.tile[data-id="${CSS.escape(id)}"]`);
    const target = tileOf(sel.id);
    if (!target) return;
    const NS = "http://www.w3.org/2000/svg";
    for (const labId of sel.prerequisites.labs) {
      const src = tileOf(labId);
      if (!src) continue;
      const a = src.getBoundingClientRect(), b = target.getBoundingClientRect();
      const down = a.top <= b.top;
      const x1 = a.left - w.left + a.width / 2, y1 = (down ? a.bottom : a.top) - w.top;
      const x2 = b.left - w.left + b.width / 2, y2 = (down ? b.top : b.bottom) - w.top;
      const my = (y1 + y2) / 2;
      const p = document.createElementNS(NS, "path");
      p.setAttribute("class", "edge");
      p.setAttribute("d", `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`);
      p.setAttribute("marker-end", "url(#arrow)");
      layer.append(p);
    }
  }

  // ------------------------------------------------------------------ panel
  function section(title, ...children) {
    return [el("h3", { text: title }), ...children];
  }
  function labChip(id) {
    const lab = BY_ID.get(id);
    if (!lab) return null;
    const done = !!state.done[id];
    return el("button", { cls: "chip", attrs: { type: "button", title: lab.title }, on: { click: () => select(id) } },
      [document.createTextNode(`${done ? "✅" : "▫️"} ${lab.label}: ${lab.title}`)]);
  }
  function renderPanel() {
    const panel = $("panel"), body = $("panelBody");
    const n = selectedId && BY_ID.get(selectedId);
    document.querySelector(".layout").classList.toggle("has-panel", !!n);
    if (!n) { panel.hidden = true; body.replaceChildren(); return; }
    panel.hidden = false;
    const prog = progression();
    const locked = isLocked(n, prog);
    const done = state.done[n.id];
    const out = [];

    out.push(el("p", { cls: "meta", text: `${nodeKindLabel(n)} · Tier ${n.tier} (${TIERS[tierIndex(n)].title})` }));
    out.push(el("h2", { text: n.title, attrs: { id: "pTitle", tabindex: "-1" } }));
    const metaBits = [];
    if (n.engine) metaBits.push(n.engine);
    if (n.arch) metaBits.push("arch: " + n.arch.join(", "));
    if (n.difficulty_raw != null) metaBits.push(`сложность ${n.difficulty}/5 (${n.difficulty_raw}/10)`);
    if (metaBits.length) out.push(el("p", { cls: "meta", text: metaBits.join(" · ") }));
    if (n.flags) {
      const f = [n.flags.steam_library ? "⭐ в моей Steam-библиотеке" : null, n.flags.author_completed ? "✅ пройдено автором" : null].filter(Boolean);
      if (f.length) out.push(el("p", { cls: "meta", text: f.join(" · ") }));
    }
    if (locked) out.push(el("div", { cls: "banner" }, [el("strong", { text: "🔒 Закрыто. " }),
      document.createTextNode(`Нужен ранг Tier ${TIERS[Math.max(0, tierIndex(n) - 1)].code}. Пройдите уровни своего тира (или один уровень на тир выше), либо включите свободный режим.`)]));

    if (n.safety.restricted) {
      out.push(el("div", { cls: "banner", attrs: { role: "note" } }, [
        el("strong", { text: "⚠️ Ограниченный уровень. " }),
        document.createTextNode("Только концептуальные подсказки. Никакого обхода защиты коммерческого ПО. Практика — на собственных бинарниках."),
        el("p", { cls: "small", text: n.safety.note }),
        el("div", { cls: "chips" }, n.safety.redirect_labs.map(labChip)),
        ...(n.safety.redirect_labs_planned && n.safety.redirect_labs_planned.length
          ? [el("p", { cls: "small planned-labs", text: "В плане (ещё не собраны): " + n.safety.redirect_labs_planned.join(", ") + " — см. docs/lab_plan.md" })]
          : []),
      ]));
    }
    if (n.safety.online_note === true) {
      out.push(el("div", { cls: "banner online-note", attrs: { role: "note" } }, [
        el("strong", { text: "🌐 Только офлайн / одиночный режим. " }),
        document.createTextNode("Античит отключён, в онлайн не заходить."),
      ]));
    }

    // what to look for (catalog / README / lab concept) - collapsed, it is spoilery
    if (n.kind === "game") {
      out.push(el("details", {}, [el("summary", {}, [document.createTextNode("Что искать — каталог репо "), srcBadge("repo_catalog")]), el("p", { text: n.what_to_find })]));
    } else if (n.kind === "campaign_quest") {
      out.push(el("details", {}, [el("summary", {}, [document.createTextNode("Текст квеста из README "), srcBadge("repo_catalog")]), el("p", { text: n.readme_text })]));
    } else {
      out.push(el("p", { text: n.concept }));
      out.push(el("p", { cls: "small", text: "Опирается на: " + n.prerequisite_text }));
      if (n.prerequisites_planned && n.prerequisites_planned.length) {
        out.push(el("p", { cls: "small planned-labs", text: "Предпосылки из плана (ещё не собраны): " + n.prerequisites_planned.join(", ") }));
      }
    }

    if (n.engine_derivation && n.engine_derivation.status === "unknown") {
      const cands = (n.engine_family_candidates || []).map((f) => FAMILY_LABEL[f] || f).join(", ");
      out.push(el("p", { cls: "small engine-unknown" }, [
        el("span", { cls: "chip", text: "Техники движка: unknown" }), srcBadge("needs_verification"),
        document.createTextNode(` Движок неоднозначен (${n.engine_derivation.reason}). Кандидаты: ${cands || "—"}. Из строки движка ничего не выведено.`),
      ]));
    }
    if (n.techniques && n.techniques.length) {
      out.push(...section("Техники", el("div", { cls: "chips" }, n.techniques.map((t) =>
        el("span", { cls: "chip" }, [document.createTextNode(TECH_LABEL[t.id] || t.id), srcBadge(t.source)])))));
    }
    if (n.tools && n.tools.length) {
      out.push(...section("Инструменты", el("div", { cls: "chips" }, n.tools.map((t) =>
        el("span", { cls: "chip" }, [document.createTextNode(TOOL_LABEL[t.id] || t.id), srcBadge(t.source)])))));
    }
    if (n.prerequisites.labs.length) {
      out.push(...section("Рекомендуемые лабы", el("div", { cls: "chips" }, n.prerequisites.labs.map(labChip)),
        el("p", { cls: "small" }, [document.createTextNode("Связи выведены правилом «техника → лаба» "), srcBadge("derived")])));
    }
    const deps = DEPENDENTS.get(n.id) || [];
    if (deps.length) out.push(el("p", { cls: "small", text: `Эта лаба рекомендована для ${deps.length} уровней — они подсвечены на карте.` }));
    if (n.notes.length) {
      out.push(...section("Мои материалы", el("ul", {}, n.notes.map((note) =>
        el("li", {}, [el("a", { text: note.path + (note.anchor ? " #" + note.anchor : ""), attrs: { href: repoHref(note.path, note.anchor), rel: "noopener noreferrer" } })])))));
    }

    // hints, revealed strictly in order
    out.push(el("h3", { text: "Подсказки" }));
    if (!n.hints.length) {
      out.push(el("p", { cls: "empty", text: "Подсказки для этого уровня ещё не написаны (этап 5)." }));
    } else {
      const opened = hintsOpened(n);
      n.hints.slice(0, opened).forEach((h) => {
        const refs = (h.refs || []).map((r) => {
          const [path, anchor] = r.split("#");
          return el("li", {}, [el("a", { text: r, attrs: { href: repoHref(path, anchor), rel: "noopener noreferrer" } })]);
        });
        out.push(el("article", { cls: "hint", attrs: { "aria-label": `Подсказка ${h.level}` } }, [
          el("div", { cls: "hint-head" }, [el("span", { text: `Подсказка ${h.level}/3 · ${KIND_HINT[h.kind] || h.kind}` }), srcBadge(h.source)]),
          el("p", { text: h.text }),
          refs.length ? el("ul", { cls: "refs" }, refs) : null,
        ]));
      });
      if (opened < n.hints.length) {
        const next = n.hints[opened];
        out.push(el("div", { cls: "row" }, [
          el("button", {
            cls: "btn", text: `Открыть подсказку ${opened + 1}/3 — ${KIND_HINT[next.kind] || next.kind}`,
            attrs: { type: "button", disabled: locked, id: "btnHint" },
            on: { click: () => revealHint(n) },
          }),
          done ? null : el("span", { cls: "small", text: `−${HINT_PENALTY * 100}% EXP за подсказку (минимум ${MIN_FACTOR * 100}%)` }),
        ]));
      }
    }

    // completion
    out.push(el("div", { cls: "row" }, done
      ? [el("span", { text: `✅ Пройдено: +${done.exp} EXP` }), el("button", { cls: "btn", text: "Отменить", attrs: { type: "button" }, on: { click: () => toggleDone(n) } })]
      : [el("button", { cls: "btn primary", text: `Отметить пройденным (+${awardFor(n)} EXP)`, attrs: { type: "button", disabled: locked, id: "btnDone" }, on: { click: () => toggleDone(n) } })]));

    body.replaceChildren(...out.filter(Boolean));
  }

  // ------------------------------------------------------------------ actions
  function select(id, opts = {}) {
    selectedId = id && BY_ID.has(id) ? id : null;
    try { history.replaceState(null, "", selectedId ? "#" + selectedId : location.pathname + location.search); } catch (e) { /* file:// quirks */ }
    renderPanel();
    markRelations();
    scheduleEdges();
    if (selectedId && opts.scroll) {
      const t = document.querySelector(`.tile[data-id="${CSS.escape(selectedId)}"]`);
      if (t) t.scrollIntoView({ block: "center" });
    }
    if (selectedId && !opts.keepFocus) { const h = $("pTitle"); if (h) h.focus({ preventScroll: true }); }
  }
  function revealHint(n) {
    if (isLocked(n, progression())) return;
    state.hints[n.id] = Math.min(n.hints.length, hintsOpened(n) + 1);
    saveState();
    renderAll();
    const b = $("btnHint") || $("btnDone");
    if (b) b.focus({ preventScroll: true });
  }
  function toggleDone(n) {
    const before = progression();
    if (state.done[n.id]) {
      delete state.done[n.id];
    } else {
      if (isLocked(n, before)) return;
      state.done[n.id] = { exp: awardFor(n) };
    }
    saveState();
    const after = progression();
    renderAll();
    if (after.idx > before.idx) toast(`🎉 Новый ранг: Tier ${TIERS[after.idx].code} — ${TIERS[after.idx].title}`);
    else if (state.done[n.id]) toast(`+${state.done[n.id].exp} EXP`);
  }
  function renderStats() {
    const p = progression();
    const t = TIERS[p.idx];
    $("rankCode").textContent = t.code;
    $("rankTitle").textContent = t.title;
    $("tpText").textContent = `${p.curTp}/3 TP`;
    $("tpFill").style.width = (p.curTp / 3) * 100 + "%";
    $("statExp").textContent = p.exp.toLocaleString("ru-RU");
    const doneOf = (list) => list.filter((n) => state.done[n.id]).length;
    $("statGames").textContent = `${doneOf(DATA.games)}/${DATA.games.length}`;
    $("statLabs").textContent = `${doneOf(DATA.labs)}/${DATA.labs.length}`;
    $("statHints").textContent = String(Object.values(state.hints).reduce((a, b) => a + b, 0));
    $("btnFree").setAttribute("aria-pressed", String(state.free));
  }
  function applyTheme() {
    if (state.theme) document.documentElement.setAttribute("data-theme", state.theme);
    else document.documentElement.removeAttribute("data-theme");
  }
  function renderAll() { renderStats(); renderMap(); renderPanel(); }

  function exportProgress() {
    const blob = new Blob([JSON.stringify({ app: "re-dojo-map", ...state }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = el("a", { attrs: { href: url, download: "re-dojo-map-progress.json" } });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function importProgress(file) {
    if (!file || file.size > 512 * 1024) { toast("Файл слишком большой или не выбран"); return; }
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        if (!parsed || parsed.app !== "re-dojo-map") throw new Error("not a re-dojo-map export");
        state = sanitizeState(parsed);
        saveState();
        applyTheme();
        renderAll();
        toast("Прогресс загружен");
      } catch (e) {
        toast("Не удалось прочитать файл прогресса");
      }
    };
    reader.readAsText(file);
  }

  function init() {
    applyTheme();
    initFilters();
    $("btnFree").addEventListener("click", () => { state.free = !state.free; saveState(); renderAll(); });
    $("btnTheme").addEventListener("click", () => {
      const dark = state.theme ? state.theme === "dark" : !matchMedia("(prefers-color-scheme: light)").matches;
      state.theme = dark ? "light" : "dark";
      saveState(); applyTheme(); scheduleEdges();
    });
    $("btnExport").addEventListener("click", exportProgress);
    $("fileImport").addEventListener("change", (e) => { importProgress(e.target.files[0]); e.target.value = ""; });
    $("btnReset").addEventListener("click", () => {
      if (!confirm("Сбросить весь прогресс карты? Это нельзя отменить.")) return;
      state = defaultState(); saveState(); applyTheme(); select(null); renderAll();
    });
    $("btnClose").addEventListener("click", () => {
      const prev = selectedId;
      select(null);
      const t = prev && document.querySelector(`.tile[data-id="${CSS.escape(prev)}"]`);
      if (t) t.focus();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && selectedId) $("btnClose").click();
      if (e.key === "/" && document.activeElement === document.body) { e.preventDefault(); $("fSearch").focus(); }
    });
    const syncFiltersHeight = () => document.documentElement.style.setProperty("--filters-h", $("filters").offsetHeight + "px");
    if (typeof ResizeObserver === "function") {
      new ResizeObserver(scheduleEdges).observe($("map"));
      new ResizeObserver(syncFiltersHeight).observe($("filters"));
    }
    syncFiltersHeight();
    window.addEventListener("resize", scheduleEdges);
    renderAll();
    const openFromHash = () => {
      let id = "";
      try { id = decodeURIComponent(location.hash.slice(1)); } catch (e) { id = ""; }
      if (BY_ID.has(id) && id !== selectedId) select(id, { scroll: true, keepFocus: true });
    };
    window.addEventListener("hashchange", openFromHash);
    openFromHash();
  }
  init();
})();
</script>
</body>
</html>
